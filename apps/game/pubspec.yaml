name: nesty_game
description: "Nesty: Doll Sort — Flutter + Flame mobile game (Android, iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  auto_route: 11.1.0
  bloc: ^9.2.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  injectable: ^3.0.0
  intl: any
  json_annotation: ^4.12.0
  nesty_core:
    path: ../../packages/nesty_core
  nesty_render:
    path: ../../packages/nesty_render

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  injectable_generator: ^3.0.2
  auto_route_generator: ^10.5.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true
  # ARB localization from day one (spec §16); see l10n.yaml.
  generate: true
