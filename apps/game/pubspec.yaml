name: nesty_game
description: "Nesty: Doll Sort — Flutter + Flame mobile game (Android, iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  auto_route: 11.1.0
  bloc: ^9.2.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_soloud: ^4.1.7
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  injectable: ^3.0.0
  intl: any
  json_annotation: ^4.12.0
  lottie: 3.6.1
  nesty_core:
    path: ../../packages/nesty_core
  nesty_render:
    path: ../../packages/nesty_render

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The on-device playthrough (integration_test/) and its `flutter drive`
  # driver, which saves the screenshots on the host (PROGRESS rule-9 table).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  injectable_generator: ^3.0.2
  auto_route_generator: ^10.5.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true
  # ARB localization from day one (spec §16); see l10n.yaml.
  generate: true

  # Offline-first (CLAUDE.md rule 3): all art, sound and fonts ship in the app.
  # skins/ symbols/ board/ themes/ audio/ are written by
  # `dart run nesty_tools:sync_design_assets` from design/ (never by hand);
  # its --check fails if a synced folder is missing here. Flutter asset
  # folders are not recursive, so every subfolder is listed.
  assets:
    - assets/audio/
    - assets/board/
    - assets/skins/classic/
    - assets/skins/forest-bear/
    - assets/skins/forest/
    - assets/skins/ocean/
    - assets/skins/space/
    - assets/skins/sweets/
    - assets/skins/winter/
    - assets/symbols/
    - assets/themes/ch01/
    - assets/themes/ch02/
    - assets/themes/ch03/
    - assets/themes/ch04/
    - assets/themes/ch05/
    - assets/themes/ch06/
    # The offline levels (spec §13.4): bundle.json, written by
    # `dart run nesty_tools:nesty_levels bundle build` from tools/levels/
    # (never by hand); CI's `bundle check` fails if it is stale.
    - assets/levels/
    # Every animation (PROGRESS D40): the 29 design/lottie/*.json, copied
    # byte for byte and validated by `sync_design_assets` (never the
    # placeholder images/, D50). Loaded once by FxLibrary with
    # LottieComposition.fromBytes; their specs are fx_spec.gen.dart.
    - assets/lottie/
    # Font licences, shown on the licence page (registered in bootstrap.dart).
    - assets/fonts/Fredoka-OFL.txt
    - assets/fonts/Nunito-OFL.txt
    - assets/fonts/MaterialSymbols-LICENSE.txt

  # Built by tools/fonts/build_fonts.sh (static instances of the pinned
  # upstream variable fonts; see tools/fonts/SHA256SUMS).
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    # Material Symbols Rounded subset (FILL 1, wght 600); see NestyIcons.
    - family: NestySymbols
      fonts:
        - asset: assets/fonts/NestySymbolsRounded.ttf
