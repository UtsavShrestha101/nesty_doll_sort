<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,1,0&display=block" rel="stylesheet"></helmet>
<div style="width:390px;padding:22px 0 24px;box-sizing:border-box;border-radius:28px;background:#FBF3E6;box-shadow:inset 0 0 0 1.5px #EAD3B0;display:flex;flex-direction:column;gap:20px;font-family:'Nunito',sans-serif;color:#5B3A21">
<div style="margin:0 15px;font:700 19px/1.2 'Fredoka',sans-serif;color:#5B3A21">{{ title }}</div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="2"><div style="display:flex;flex-direction:column;gap:7px">
<div style="margin:0 15px;font:600 11px/1.45 ui-monospace,Menlo,monospace;color:#8A6A4E">{{ r.cap }}</div>
<div style="position:relative;width:{{ r.w }}px;margin-left:{{ r.ml }}px;height:{{ r.boxH }}px;border-radius:{{ r.br }};background:url(backgrounds/ch3-seaside-market.svg) center top/390px auto no-repeat,#F3E6CF;overflow:hidden">
<div style="position:absolute;left:16px;top:{{ r.pauseY }}px;width:48px;height:48px;border-radius:17px;background:linear-gradient(180deg,#FFF9EE,#FCEBD0);box-shadow:inset 0 2px 0 #fff,0 5px 0 #D8B07A;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Rounded';font-size:28px;color:#6E4526;font-variation-settings:'FILL' 1,'wght' 600">pause</div>
<div style="position:absolute;left:76px;right:16px;top:12px;height:{{ r.stripH }}px;border-radius:18px;background:linear-gradient(180deg,#FFF9EE,#FCEBD0);box-shadow:inset 0 2px 0 #fff,0 5px 0 #D8B07A,0 9px 14px rgba(90,50,20,.22);display:flex;align-items:center;gap:9px;padding:0 12px 0 5px;box-sizing:border-box">
<div style="width:38px;height:38px;flex:none;border-radius:50%;background:url({{ r.art }}) center/100% 100% no-repeat;box-shadow:0 0 0 2px #FFFDF7,0 2px 4px rgba(60,25,5,.25)"></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:center;gap:6px;min-width:0"><span style="font:700 {{ r.nameFs }}px/1 {{ r.dispFont }};color:#5B3A21;white-space:nowrap">{{ r.name }}</span><sc-if value="{{ r.tag1 }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:3px;height:{{ r.tagH }}px;padding:0 7px 0 5px;border-radius:{{ r.tagR }}px;background:#FFFDF7;box-shadow:inset 0 0 0 1.5px #D8B07A;color:#6E4526;font:800 {{ r.tagFs }}px/1 {{ r.bodyFont }};white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:{{ r.tagGs }}px;font-weight:400;font-variation-settings:'FILL' 1,'wght' 600">computer</span>{{ r.tag }}</div></sc-if></div>
<sc-if value="{{ r.stateOn }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:3px;font:700 {{ r.stateFs }}px/1 {{ r.bodyFont }};color:#8A5B3A;white-space:nowrap">{{ r.state }}<span style="display:inline-flex;gap:2px;margin-left:1px"><span style="width:3px;height:3px;border-radius:50%;background:#8A5B3A"></span><span style="width:3px;height:3px;border-radius:50%;background:#8A5B3A;opacity:.6"></span><span style="width:3px;height:3px;border-radius:50%;background:#8A5B3A;opacity:.3"></span></span></div></sc-if>
<sc-if value="{{ r.tag2 }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:5px"><div style="display:flex;align-items:center;gap:3px;height:{{ r.tagH }}px;padding:0 7px 0 5px;border-radius:{{ r.tagR }}px;background:#FFFDF7;box-shadow:inset 0 0 0 1.5px #D8B07A;color:#6E4526;font:800 {{ r.tagFs }}px/1 {{ r.bodyFont }};white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:{{ r.tagGs }}px;font-weight:400;font-variation-settings:'FILL' 1,'wght' 600">computer</span>{{ r.tag }}</div><span style="font-family:'Material Symbols Rounded';font-size:{{ r.stGs }}px;color:{{ r.stGc }};font-variation-settings:'FILL' 1,'wght' 600">{{ r.stG }}</span></div></sc-if>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;flex:none"><div style="font:700 {{ r.countFs }}px/1 'Fredoka',sans-serif;color:#3242A8;font-variant-numeric:tabular-nums">{{ r.count }}</div><sc-if value="{{ r.dotsOn }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:3px"><sc-for list="{{ r.dots }}" as="dt" hint-placeholder-count="8"><div style="width:8px;height:8px;border-radius:50%;background:{{ dt.bg }};box-shadow:{{ dt.sh }}"></div></sc-for></div></sc-if></div>
</div></div>
<sc-if value="{{ r.noteOn }}" hint-placeholder-val="{{ false }}"><div style="margin:0 15px;font:600 13px/1.45 'Nunito',sans-serif;color:#7A5234;text-wrap:pretty">{{ r.note }}</div></sc-if>
</div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:520},&quot;set&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;noDots&quot;,&quot;twoLine&quot;],&quot;default&quot;:&quot;noDots&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const RIV = { Pebble: 'ui/rivals/rival_1.svg', Button: 'ui/rivals/rival_2.svg', Comet: 'ui/rivals/rival_3.svg' };
const FRED = "'Fredoka',sans-serif", NUN = "'Nunito',sans-serif", JP = "'M PLUS Rounded 1c',sans-serif";
const dots = (n, f) => Array.from({ length: n }, (_, i) => i < f ? { bg: '#4E5FD9', sh: '0 0 0 1.5px #FFFDF7' } : { bg: '#EAD3B0', sh: 'inset 0 1px 2px rgba(90,45,15,.25)' });
const row = o => { const k = o.k || 1, jp = !!o.jp, two = o.form === 'two';
  return { cap: o.cap, note: o.note || '', noteOn: !!o.note, w: o.w, ml: o.w >= 390 ? 0 : 15, br: o.w >= 390 ? '0' : '16px', art: RIV[o.rival], name: o.name || o.rival, tag: o.tag, state: o.state || '', stateOn: !two && !!o.state,
    tag1: !two, tag2: two, dotsOn: o.form === 'one', dots: dots(o.total || 8, o.done || 3), count: `${o.done || 3}/${o.total || 8}`,
    nameFs: +(16 * k * (jp ? .94 : 1)).toFixed(1), tagFs: +(11 * k * (jp ? .94 : 1)).toFixed(1), tagGs: Math.round(14 * k), tagH: Math.round(20 * k), tagR: Math.round(10 * k), stateFs: +(12 * k).toFixed(1), countFs: +(17 * k).toFixed(1),
    stG: o.stG || 'more_horiz', stGc: o.stG === 'check_circle' ? '#46A758' : '#8A5B3A', stGs: Math.round(16 * k),
    dispFont: jp ? JP : FRED, bodyFont: jp ? JP : NUN, stripH: two && k > 1.1 ? 58 : 48, pauseY: two && k > 1.1 ? 17 : 12, boxH: (two && k > 1.1 ? 58 : 48) + 24 };
};
const SETS = {
  noDots: { title: '9.3h · The count without dots', rows: [
    row({ cap: 'fr · 360 dp · 1.0× · name + tag need the room', w: 360, rival: 'Button', tag: 'Ordinateur', state: 'Réfléchit', form: 'nodots' }),
    row({ cap: 'en · 390 dp · 1.0× · 10 families (more than 8 dots)', w: 390, rival: 'Pebble', tag: 'Computer', state: 'Thinking', form: 'nodots', total: 10, done: 4, note: 'The count stands alone in the right column, centred on the strip, at the 9.3 size. The state line stays under the name. The game picks the form by measuring: 9.3 when the name, the tag and 8 dots fit one line; this form when they don’t, or when the race has more than 8 families.' }),
  ] },
  twoLine: { title: '9.3i · The tag on the second line', rows: [
    row({ cap: 'en · 360 dp · 1.3× text · Thinking', w: 360, rival: 'Button', tag: 'Computer', form: 'two', k: 1.3, stG: 'more_horiz' }),
    row({ cap: 'ja · 360 dp · 1.0× · Starting over', w: 360, rival: 'Comet', name: 'コメット', tag: 'コンピューター', form: 'two', jp: true, stG: 'replay' }),
    row({ cap: 'es · 360 dp · 1.0× · Finished', w: 360, rival: 'Pebble', tag: 'Ordenador', form: 'two', stG: 'check_circle', done: 8, note: 'Name on the first line, the Computer tag on the second, and the state comes back as one 16 dp glyph after the tag: more_horiz (Thinking, the dots pulse as in 9.3), replay (Starting over), check_circle in green (Finished). The dots don’t shrink: 8 dp is the smallest dot that still reads at arm’s length. At 1.3× text the strip grows to 58 dp and the family counter moves down with it.' }),
  ] },
};
class Component extends DCLogic {
  renderVals() { const s = SETS[this.props.set] || SETS.noDots; return { title: s.title, rows: s.rows }; }
}
</script>
</body>
</html>
